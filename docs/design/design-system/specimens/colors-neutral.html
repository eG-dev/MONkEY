<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Neutral palette</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="specimen.css">
</head>

<body>
    <div class="row">
        <div class="sw"><div class="chip" style="background:var(--grey-50)"></div><div class="n">grey-50</div><div class="v">#F5F5F5</div></div>
        <div class="sw"><div class="chip" style="background:var(--grey-100)"></div><div class="n">grey-100</div><div class="v">#EBEBEB</div></div>

        <div class="sw"><div class="chip" style="background:var(--grey-800)"></div><div class="n">grey-800</div><div class="v">#2E2E2E</div></div>
        <div class="sw"><div class="chip" style="background:var(--grey-900)"></div><div class="n">grey-900</div><div class="v">#1F1F1F</div></div>

</html>
