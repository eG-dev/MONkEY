<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Spacing scale</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="specimen.css">
    <script src="specimen.js" defer></script>
    <style>
        .scale {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 14px;
        }

        .scale > div {
            text-align: center;
        }

        .scale span {
            display: block;
            margin: 0 auto;
            background: var(--pm-color-primary);
        }
    </style>
</head>

<body>
    <div class="scale">
        <div><span style="width:2px;height:2px"></span><div class="v">1·2</div></div>
        <div><span style="width:4px;height:4px"></span><div class="v">2·4</div></div>
        <div><span style="width:8px;height:8px"></span><div class="v">3·8</div></div>
        <div><span style="width:12px;height:12px"></span><div class="v">4·12</div></div>
        <div><span style="width:16px;height:16px"></span><div class="v">5·16</div></div>
        <div><span style="width:20px;height:20px"></span><div class="v">6·20</div></div>
        <div><span style="width:24px;height:24px"></span><div class="v">7·24</div></div>
        <div><span style="width:32px;height:32px"></span><div class="v">8·32</div></div>
        <div><span style="width:40px;height:40px"></span><div class="v">9·40</div></div>
        <div><span style="width:48px;height:48px"></span><div class="v">10·48</div></div>
    </div>
</body>

</html>
