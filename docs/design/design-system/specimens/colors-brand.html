<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Brand palette</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="specimen.css">
    <script src="specimen.js" defer></script>
</head>

<body>
    <div class="row">
        <div class="sw">
            <div class="chip" style="background:var(--pm-color-primary)"></div>
            <div class="n">primary</div>
            <div class="v">#650000</div>
        </div>
        <div class="sw">
            <div class="chip" style="background:var(--primary-hover)"></div>
            <div class="n">primary hover*</div>
            <div class="v">#841A1A</div>
        </div>
        <div class="sw">
            <div class="chip" style="background:var(--primary-active)"></div>
            <div class="n">primary active*</div>
            <div class="v">#4A0000</div>
        </div>
        <div class="sw">
            <div class="chip" style="background:var(--pm-color-secondary)"></div>
            <div class="n">secondary</div>
            <div class="v">#E5BFA7</div>
        </div>
        <div class="sw">
            <div class="chip" style="background:var(--pm-color-tertiary)"></div>
            <div class="n">tertiary*</div>
            <div class="v">#F7EBE3</div>
        </div>
        <div class="sw">
            <div class="chip" style="background:var(--pm-color-toolbar)"></div>
            <div class="n">toolbar</div>
            <div class="v">#2E2E2E</div>
        </div>
    </div>
    <div class="v" style="margin-top:10px">Primary and secondary are sampled from the logo. * derived</div>
</body>

</html>
