<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Application shell</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="specimen.css">
    <script src="specimen.js" defer></script>
    <style>
        .shell {
            display: grid;
            grid-template-columns: 160px 1fr;
            grid-template-rows: 32px 1fr 40px;
            gap: 3px;
            height: 260px;
            font: var(--type-caption);
            color: var(--text-secondary);
        }

        .shell > div {
            padding: 6px;
            border: 1px solid var(--border-default);
        }

        .toolbar {
            grid-column: 1 / 3;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-header);
            color: var(--text-on-header);
            border: 0 !important;
        }

        .navigation {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .main {
            grid-column: 2;
            grid-row: 2 / 4;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 80%;
            padding: 6px;
            border: 1px dashed var(--border-strong);
            background: var(--surface-panel);
        }
    </style>
</head>

<body>
    <div class="shell">
        <div class="toolbar"><span>&#9776; logo</span><span>user menu</span></div>
        <div class="navigation"><span>Overview<br><span style="font-size:10px">temporary drawer &lt;1440px</span></span><span>Administration</span></div>
        <div class="main"><div class="container">main content · max 1440px, centered</div></div>
        <div style="grid-column:1;grid-row:3;background:var(--surface-sunken)">application name · version</div>
    </div>
</body>

</html>
