<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POCKET MONkEY</title>
  <link rel="stylesheet" href="../../design-system/styles.css">
  <link rel="stylesheet" href="../shared/prototype.css">
  <style>
    body { overflow: auto; background: var(--surface-panel); }
    .page { display: grid; place-items: center; min-height: 100dvh; padding: 72px 16px 32px; }
    .languages { position: fixed; top: 16px; inset-inline-end: 16px; display: flex; border: 1px solid var(--border-default); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface-raised); }
    .languages button { min-height: var(--control-md); padding: 0 14px; border: 0; background: transparent; color: var(--text-primary); }
    .languages button[aria-pressed="true"] { background: var(--action-primary); color: var(--action-primary-text); }
    .card { display: grid; gap: var(--space-5); width: min(440px, 100%); padding: var(--space-8); border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--surface-raised); box-shadow: var(--shadow-1); }
    .card-logo { justify-self: center; width: 260px; max-width: 100%; }
    .card h1 { font: var(--type-h1); text-align: center; }
    .hint-center { text-align: center; }
    .prototype-note { width: min(440px, 100%); margin-top: var(--space-5); font: var(--type-caption); color: var(--text-secondary); }
    @media (max-width: 599px) {
      body { background: var(--surface-raised); }
      .page { place-items: start center; }
      .card { padding: 0; border: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div id="view"></div>
  <script src="../shared/data.js"></script>
  <script src="../shared/prototype.js"></script>
  <script>
    const view = document.getElementById('view');
    const params = new URLSearchParams(location.search);
    const PASSWORD = 'pocket-monkey';
    const failures = {};
    let mode = 'signin';
    let pendingUser = null;
    let notice = params.has('expired') ? ['info', 'expired'] : params.get('signedout') === 'password' ? ['info', 'passwordChanged'] : params.has('signedout') ? ['info', 'signedOut'] : null;
    let username = '';

    function message() {
      if (!notice) {
        return '';
      }

      const [tone, key] = notice;
      return `<div class="message message-${tone}" role="${tone === 'error' ? 'alert' : 'status'}">${PM.icon(tone)}<div class="message-body">${PM.esc(PM.t(key))}</div></div>`;
    }

    function render() {
      const languages = `<div class="languages" role="group" aria-label="${PM.esc(PM.t('language'))}"><button type="button" data-language="de" aria-pressed="${PM.prefs.language === 'de'}" lang="de">Deutsch</button><button type="button" data-language="en" aria-pressed="${PM.prefs.language === 'en'}" lang="en">English</button></div>`;
      const form = mode === 'signin'
        ? `<h1>${PM.esc(PM.t('signIn'))}</h1>${message()}
          <form class="form" id="signin-form" novalidate>
            <div class="field"><label for="username">${PM.esc(PM.t('username'))}</label><input class="input" id="username" autocomplete="username" autocapitalize="none" value="${PM.esc(username)}"></div>
            <div class="field"><label for="password">${PM.esc(PM.t('password'))}</label><input class="input" type="password" id="password" autocomplete="current-password"></div>
            <button class="button button-primary button-block" type="submit" id="submit">${PM.esc(PM.t('signIn'))}</button>
          </form>
          <p class="hint hint-center">${PM.esc(PM.t('forgot'))}</p>`
        : `<h1>${PM.esc(PM.t('changeTitle'))}</h1>${message()}
          <form class="form" id="change-form" novalidate>
            <div class="field"><label for="current">${PM.esc(PM.t('currentPassword'))}</label><input class="input" type="password" id="current" autocomplete="current-password"></div>
            <div class="field"><label for="new">${PM.esc(PM.t('newPassword'))}</label><input class="input" type="password" id="new" autocomplete="new-password"><span class="hint">${PM.esc(PM.t('passwordHint'))}</span></div>
            <button class="button button-primary button-block" type="submit" id="submit">${PM.esc(PM.t('changePassword'))}</button>
          </form>
          <button class="button button-link hint-center" type="button" id="cancel-change">${PM.esc(PM.t('signOut'))}</button>`;
      view.innerHTML = `${languages}<div class="page"><div><main class="card"><img class="card-logo" src="../../assets/images/monkey.png" alt="POCKET MONkEY">${form}</main>
        <p class="prototype-note">Prototype: password for every user is <code>${PASSWORD}</code>. Try <code>emma</code> (Member), <code>mara</code> (Manager), <code>lena</code> (must change password), or wrong passwords five times. Add <code>?expired=1</code> to the URL for an expired session.</p></div></div>`;
      document.title = `${PM.t(mode === 'signin' ? 'signIn' : 'changeTitle')} – POCKET MONkEY`;
      view.querySelectorAll('[data-language]').forEach(button => button.addEventListener('click', () => PM.savePrefs({ language: button.dataset.language })));
      document.getElementById('signin-form')?.addEventListener('submit', signIn);
      document.getElementById('change-form')?.addEventListener('submit', changePassword);
      document.getElementById('cancel-change')?.addEventListener('click', () => {
        mode = 'signin';
        notice = ['info', 'signedOut'];
        render();
      });
    }

    async function signIn(event) {
      event.preventDefault();
      const nameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const submit = document.getElementById('submit');
      username = nameInput.value.trim().toLowerCase();
      const nameOk = PM.fieldError(nameInput, username ? '' : PM.t('required'));
      const passwordOk = PM.fieldError(passwordInput, passwordInput.value ? '' : PM.t('required'));

      if (!nameOk || !passwordOk) {
        (nameOk ? passwordInput : nameInput).focus();
        return;
      }

      submit.disabled = true;
      submit.textContent = PM.t('signingIn');

      try {
        await PM.request(500);
      } catch {
        notice = ['error', 'unavailable'];
        render();
        return;
      }

      const user = PM.data.users.find(item => item.username === username);

      if ((failures[username] ?? 0) >= 5) {
        notice = ['error', 'locked'];
      } else if (!user || user.status === 'disabled' || passwordInput.value !== PASSWORD) {
        failures[username] = (failures[username] ?? 0) + 1;
        notice = ['error', failures[username] >= 5 ? 'locked' : 'invalid'];
      } else if (user.status === 'mustChange') {
        pendingUser = user;
        mode = 'change';
        notice = ['info', 'mustChange'];
      } else {
        PM.savePrefs({ user: user.id, language: PM.prefs.language });
        location.href = '../accounts-overview/index.html';
        return;
      }

      render();
      document.getElementById(mode === 'signin' ? 'password' : 'current').focus();
    }

    async function changePassword(event) {
      event.preventDefault();
      const current = document.getElementById('current');
      const next = document.getElementById('new');
      const submit = document.getElementById('submit');
      const currentOk = PM.fieldError(current, current.value ? '' : PM.t('required'));
      const nextOk = PM.fieldError(next, next.value.length < 12 ? PM.t('passwordShort') : '');

      if (!currentOk || !nextOk) {
        (currentOk ? next : current).focus();
        return;
      }

      submit.disabled = true;
      submit.textContent = PM.t('saving');

      try {
        await PM.request();
        pendingUser.status = 'active';
        PM.saveData();
        mode = 'signin';
        notice = ['success', 'passwordChanged'];
      } catch {
        notice = ['error', 'saveFailed'];
      }

      render();
    }

    PM.init({
      shell: false,
      render,
      strings: {
        en: {
          signIn: 'Sign in', signingIn: 'Signing in…', language: 'Language', username: 'Username', password: 'Password', forgot: 'Forgot your password? Ask a Manager to reset it.',
          invalid: 'Username or password is incorrect.', locked: 'Too many failed attempts. Try again in 15 minutes.', unavailable: 'Sign-in is temporarily unavailable. Please try again later.',
          expired: 'Your session has expired. Please sign in again.', signedOut: 'You have been signed out.', passwordChanged: 'Password changed. Please sign in again.',
          changeTitle: 'Change your password', mustChange: 'Your password was set by a Manager. Choose a new one to continue.', currentPassword: 'Current password', newPassword: 'New password',
          passwordHint: 'At least 12 characters', passwordShort: 'Use at least 12 characters.', changePassword: 'Change password'
        },
        de: {
          signIn: 'Anmelden', signingIn: 'Anmeldung läuft…', language: 'Sprache', username: 'Benutzername', password: 'Passwort', forgot: 'Passwort vergessen? Bitte einen Manager, es zurückzusetzen.',
          invalid: 'Benutzername oder Passwort ist falsch.', locked: 'Zu viele Fehlversuche. Bitte in 15 Minuten erneut versuchen.', unavailable: 'Die Anmeldung ist vorübergehend nicht möglich. Bitte später erneut versuchen.',
          expired: 'Deine Sitzung ist abgelaufen. Bitte melde dich erneut an.', signedOut: 'Du wurdest abgemeldet.', passwordChanged: 'Passwort geändert. Bitte erneut anmelden.',
          changeTitle: 'Passwort ändern', mustChange: 'Dein Passwort wurde von einem Manager festgelegt. Wähle ein neues, um fortzufahren.', currentPassword: 'Aktuelles Passwort', newPassword: 'Neues Passwort',
          passwordHint: 'Mindestens 12 Zeichen', passwordShort: 'Mindestens 12 Zeichen verwenden.', changePassword: 'Passwort ändern'
        }
      }
    });
  </script>
</body>
</html>
