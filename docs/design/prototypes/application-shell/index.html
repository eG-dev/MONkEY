<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POCKET MONkEY</title>
  <link rel="stylesheet" href="../../design-system/styles.css">
  <link rel="stylesheet" href="../shared/prototype.css">
  <style>
    .placeholder { display: grid; place-items: center; min-height: calc(100dvh - var(--header-height) - 2 * var(--space-7)); padding: var(--space-7); border: 1px dashed var(--border-strong); border-radius: var(--radius-md); background: var(--surface-panel); color: var(--text-secondary); text-align: center; }
  </style>
</head>
<body>
  <div id="view"></div>
  <script src="../shared/data.js"></script>
  <script src="../shared/prototype.js"></script>
  <script>
    PM.init({
      title: 'shell',
      render: () => {
        document.getElementById('view').innerHTML = `<div class="placeholder"><p>${PM.esc(PM.t('placeholder'))}</p></div>`;
      },
      strings: {
        en: { shell: 'Application shell', placeholder: 'The main content container. Each view has its own prototype.' },
        de: { shell: 'Anwendungsrahmen', placeholder: 'Der Hauptinhaltsbereich. Jede Ansicht hat einen eigenen Prototyp.' }
      }
    });
  </script>
</body>
</html>
