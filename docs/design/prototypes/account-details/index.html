<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POCKET MONkEY</title>
  <link rel="stylesheet" href="../../design-system/styles.css">
  <link rel="stylesheet" href="../shared/prototype.css">
  <style>
    .back-link { margin-bottom: var(--space-7); }
    .details-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-5); margin-bottom: var(--space-7); }
    .details-head > .page-title { min-width: 0; overflow-wrap: anywhere; }
    .details-head > .avatar, .details-head > button { flex-shrink: 0; }
    .details-head > .view-actions { margin-inline-start: auto; }
    .view-actions { display: flex; align-items: center; justify-content: end; gap: var(--space-3); max-width: 100%; }
    .view-actions > .icon-button { flex-shrink: 0; }
    .view-actions > .button { white-space: normal; }
    .delete-action { color: var(--action-danger); border-color: var(--action-danger); }
    .retired-banner { margin-bottom: var(--space-7); align-items: center; }
    .retired-banner .message-body { flex: 1; }
    .retired-banner .button { margin-inline-start: auto; }
    .avatar-button { position: relative; padding: 0; border: 0; border-radius: 50%; background: none; }
    .avatar-button:hover .avatar { outline: 2px solid var(--border-strong); }
    .avatar-badge { position: absolute; inset-inline-end: -2px; inset-block-end: -2px; display: grid; place-items: center; width: 26px; height: 26px; border: 0; border-radius: 50%; background: var(--surface-panel); color: var(--icon-default); }
    .avatar-badge .icon { width: 14px; height: 14px; }
    .image-field { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-5); }
    .image-field .avatar { width: 96px; height: 96px; font-size: var(--fs-32); }
    .layout { display: grid; grid-template-columns: minmax(300px, 440px) minmax(0, 1fr); gap: var(--space-7); align-items: start; }
    .layout > * { min-width: 0; }
    .side > * + * { margin-top: var(--space-5); }
    .label { font: var(--type-caption); color: var(--text-secondary); }
    #history-title { font: var(--type-caption); color: var(--text-secondary); }
    .balance { font: var(--type-display); font-weight: var(--weight-medium); text-align: end; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .allowance { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; column-gap: var(--space-4); row-gap: var(--space-5); margin-top: var(--space-5); }
    .allowance-amount { font: var(--type-h3); }
    .allowance-state { display: flex; align-items: flex-start; gap: var(--space-2); font-weight: var(--weight-medium); margin-bottom: var(--space-2); }
    .allowance-state > .icon { flex-shrink: 0; }
    #allowance-scheduled:not(.allowance-state) { margin-top: var(--space-4); }
    #allowance-current { margin-top: var(--space-3); }
    .allowance-paused-notice { margin-top: var(--space-4); }
    .allowance-execution { margin-top: var(--space-7); padding-top: var(--space-5); border-top: var(--border-width) solid var(--border-subtle); }
    .allowance-execution > h3 { margin: 0 0 var(--space-3); font: var(--type-caption); font-weight: var(--weight-medium); color: var(--text-secondary); }
    .allowance-credit { display: flex; align-items: center; gap: var(--space-2); margin: 0; }
    .allowance-credit > .icon { flex-shrink: 0; }
    .allowance-execution > .message { margin-top: var(--space-4); }
    .allowance-failed, .allowance-failed > .icon { color: var(--status-error-fg); }
    .pager { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); margin-top: var(--space-5); }
    .type-label { white-space: nowrap; }
    .transaction-form .segments span { gap: 6px; }
    .transaction-form .segments .icon { width: 16px; height: 16px; }
    .transaction-form[data-mode="deposit"] .segments input:checked + span { background: var(--action-deposit); color: var(--action-deposit-text); }
    .transaction-form[data-mode="withdrawal"] .segments input:checked + span { background: var(--action-withdrawal); color: var(--action-withdrawal-text); }
    .transaction-form[data-mode="deposit"] .mode-submit { background: var(--action-deposit); color: var(--action-deposit-text); }
    .transaction-form[data-mode="deposit"] .mode-submit:hover:not(:disabled) { background: var(--action-deposit-hover); color: var(--action-deposit-text); }
    .transaction-form[data-mode="withdrawal"] .mode-submit { background: var(--action-withdrawal); color: var(--action-withdrawal-text); }
    .transaction-form[data-mode="withdrawal"] .mode-submit:hover:not(:disabled) { background: var(--action-withdrawal-hover); color: var(--action-withdrawal-text); }
    .mode-submit:disabled { background: var(--action-disabled) !important; color: var(--text-disabled) !important; }
    .input-prefix { position: absolute; inset-inline-start: 10px; font-weight: var(--weight-bold); pointer-events: none; }
    .transaction-form[data-mode="deposit"] .input-prefix { color: var(--amount-positive); }
    .transaction-form[data-mode="withdrawal"] .input-prefix { color: var(--amount-negative); }
    .transaction-form .input-wrap .input { padding-inline-start: 28px; }
    @media (max-width: 899px) { .layout { grid-template-columns: 1fr; } }
    @media (max-width: 599px) {
      .table thead { display: none; }
      .table tr { display: grid; grid-template-columns: 1fr auto; padding: 8px 0; }
      .table td { border: 0; padding: 2px 4px; }
      .table td.comment { grid-column: 1; grid-row: 1; font-weight: var(--weight-medium); }
      .table td.meta { grid-column: 1; grid-row: 2; font: var(--type-caption); color: var(--text-secondary); }
      .table td.numeric { grid-column: 2; grid-row: 1 / 3; align-self: center; }
      .table td.date, .table td.type, .table td.by { display: none; }
    }
    @media (min-width: 600px) { .table td.meta, .phone-only { display: none; } }
    @media (max-width: 599px) { .wide-only { display: none; } }
  </style>
</head>
<body>
  <div id="view"></div>
  <script src="../shared/data.js"></script>
  <script src="../shared/prototype.js"></script>
  <script>
    const view = document.getElementById('view');
    const id = new URLSearchParams(location.search).get('account') ?? 'noah';
    const PAGE_SIZE = 20;
    const PROTOTYPE_NOW = PM.now();
    let page = 0;
    let draft = { type: 'deposit', amount: '', comment: '' };

    function back() {
      return `<a class="back-link" href="../accounts-overview/index.html">${PM.icon('back')}${PM.esc(PM.t('overview'))}</a>`;
    }

    function allowanceReviewAccount(account, state) {
      const reviewStates = ['no-credit-this-month-planned-next', 'credited-this-month-disabled-next', 'credited-this-month-changed-next'];

      if (!account || !reviewStates.includes(state)) {
        return account;
      }

      const reviewAccount = structuredClone(account);
      const credited = state !== 'no-credit-this-month-planned-next';
      const nextEnabled = state !== 'credited-this-month-disabled-next';
      const nextAmount = state === 'credited-this-month-changed-next' ? 3000 : 2000;
      reviewAccount.allowance = { enabled: credited, amount: 2000 };
      reviewAccount.allowanceScheduled = { enabled: nextEnabled, amount: nextAmount, effectiveMonth: '2026-11' };
      reviewAccount.history = reviewAccount.history.filter(entry => entry.type !== 'allowance' || PM.businessMonth(entry.at) < '2026-10');

      if (!reviewAccount.history.some(entry => entry.type === 'opening')) {
        reviewAccount.history.push({ at: '2026-09-01T08:00:00+02:00', type: 'opening', amount: 0, comment: '', by: 'Mara Example' });
      }

      if (credited) {
        reviewAccount.history.push({ at: '2026-10-01T00:00:00+02:00', type: 'allowance', amount: 2000, comment: '', by: 'automatic', allowanceMonth: '2026-10' });
      }

      return reviewAccount;
    }

    function render() {
      const state = PM.prefs.viewState;
      const account = allowanceReviewAccount(PM.account(id), state);

      if (state === 'loading') {
        view.innerHTML = `${back()}<div class="layout" aria-busy="true"><div class="skeleton" style="height:320px"></div><div class="skeleton" style="height:480px"></div></div>`;
        return;
      }

      if (state === 'error' || !account) {
        view.innerHTML = `${back()}<div class="message message-error" role="alert">${PM.icon('error')}<div class="message-body"><span>${PM.esc(PM.t(account ? 'loadFailed' : 'accountNotFound'))}</span>${account ? `<div><button class="button button-secondary" type="button" id="retry">${PM.esc(PM.t('tryAgain'))}</button></div>` : ''}</div></div>`;
        document.getElementById('retry')?.addEventListener('click', () => PM.savePrefs({ viewState: 'normal' }));
        return;
      }

      const balance = PM.balance(account);
      const money = PM.money(balance);
      const retired = Boolean(account.purgeAtUtc);
      const manager = PM.isManager();
      const editable = manager && !retired;
      view.innerHTML = `${back()}
        <div class="details-head">${editable ? `<button class="avatar-button" type="button" id="edit-image" aria-label="${PM.esc(PM.t('changeImage', { name: account.name }))}" title="${PM.esc(PM.t('changeImage', { name: account.name }))}">${PM.avatar(account)}<span class="avatar-badge" aria-hidden="true">${PM.icon('pencil')}</span></button>` : PM.avatar(account)}<h1 class="page-title">${PM.esc(account.name)}</h1>${editable ? `<button class="icon-button" type="button" id="edit-name" aria-label="${PM.esc(PM.t('editNamed', { name: account.name }))}" title="${PM.esc(PM.t('editNamed', { name: account.name }))}">${PM.icon('pencil')}</button>` : ''}<div class="view-actions">${editable ? `<button class="icon-button delete-action" type="button" id="delete-account" aria-label="${PM.esc(PM.t('deleteAccount'))}" title="${PM.esc(PM.t('deleteAccount'))}">${PM.icon('delete')}</button>` : ''}<button class="icon-button" type="button" id="refresh-view" aria-label="${PM.esc(PM.t('refresh'))}" title="${PM.esc(PM.t('refresh'))}">${PM.icon('refresh')}</button>${editable && balance !== null ? `<button class="button button-primary" type="button" id="record-transaction">${PM.icon('plus')}${PM.esc(PM.t('recordTransaction'))}</button>` : ''}</div></div>
        ${retired ? `<div class="message message-warning retired-banner" role="status">${PM.icon('warning')}<div class="message-body">${PM.esc(PM.t('scheduledForDeletion', { date: PM.date(account.purgeAtUtc, false) }))}</div>${manager ? `<button class="button button-secondary" type="button" id="reactivate-account">${PM.esc(PM.t('reactivate'))}</button>` : ''}</div>` : ''}
        <div class="layout">
          <div class="side">
            <section class="panel" aria-labelledby="balance-label"><div class="label" id="balance-label">${PM.esc(PM.t('balance'))}</div><div class="balance ${money.cls}">${PM.esc(money.text)}</div></section>
            <section class="panel" aria-labelledby="allowance-label">${allowancePanel(account)}</section>
            ${formSection(account, balance)}
          </div>
          <section class="panel" aria-labelledby="history-title"><h2 class="panel-title" id="history-title">${PM.esc(PM.t('transactions'))}</h2>${history(account)}</section>
        </div>`;
      bind(account, balance);
      document.getElementById('edit-name')?.addEventListener('click', () => renameAccount(account));
      document.getElementById('delete-account')?.addEventListener('click', () => deleteAccount(account));
      document.getElementById('reactivate-account')?.addEventListener('click', () => reactivateAccount(account));
      document.getElementById('refresh-view').addEventListener('click', render);
    }

    function deleteAccount(account) {
      const confirm = PM.dialog({
        title: PM.t('deleteAccount'),
        body: `<p>${PM.esc(PM.t('deleteExplanation', { name: account.name }))}</p>`,
        footer: `<button class="button button-secondary" type="button" data-close>${PM.esc(PM.t('cancel'))}</button><button class="button button-danger" type="button" id="confirm-delete">${PM.esc(PM.t('deleteAccount'))}</button>`
      });
      const button = confirm.querySelector('#confirm-delete');
      button.addEventListener('click', async () => {
        button.disabled = true;
        button.textContent = PM.t('saving');
        confirm.querySelector('.message-error')?.remove();

        try {
          await PM.request();
          const hasActivity = account.history.some(entry => ['deposit', 'withdrawal', 'allowance'].includes(entry.type));

          if (hasActivity) {
            account.purgeAtUtc = new Date(PROTOTYPE_NOW.getTime() + 30 * 24 * 60 * 60 * 1000).toISOString();
            const status = PM.allowanceStatus(account);
            const currentMonth = PM.businessMonth(PROTOTYPE_NOW);
            const completedMonths = new Set([
              ...(account.droppedAllowanceMonths ?? []),
              ...account.history.filter(entry => entry.type === 'allowance').map(entry => entry.allowanceMonth ?? PM.businessMonth(entry.at))
            ]);
            const failedPeriod = account.allowance.failedPeriod;
            const missedMonths = failedPeriod && !completedMonths.has(failedPeriod) ? [failedPeriod] : [];

            if (status.configured && !status.credited && !completedMonths.has(currentMonth) && !missedMonths.includes(currentMonth)) {
              missedMonths.push(currentMonth);
            }

            account.missedAllowanceMonths = missedMonths.map(month => ({ month, amount: account.allowance.amount }));
          } else {
            PM.data.accounts = PM.data.accounts.filter(item => item.id !== account.id);
          }

          PM.saveData();
          confirm.close();
          location.href = '../accounts/index.html';
        } catch {
          confirm.querySelector('.dialog-body').insertAdjacentHTML('afterbegin', `<div class="message message-error" role="alert">${PM.icon('error')}<div class="message-body">${PM.esc(PM.t('saveFailed'))}</div></div>`);
          button.disabled = false;
          button.textContent = PM.t('deleteAccount');
        }
      });
    }

    function reactivateAccount(account) {
      const outstanding = account.missedAllowanceMonths ?? [];
      const expired = new Date(account.purgeAtUtc) <= PROTOTYPE_NOW;
      const choices = outstanding.length ? `<fieldset class="field"><legend>${PM.esc(PM.t('missedAllowance'))}</legend><div class="segments segments-block"><label><input id="credit-missed" type="radio" name="missed-policy" value="credit"><span>${PM.esc(PM.t('creditMissed'))}</span></label><label><input type="radio" name="missed-policy" value="drop"><span>${PM.esc(PM.t('dropMissed'))}</span></label></div></fieldset>` : '';
      const confirm = PM.dialog({
        title: PM.t('reactivate'),
        body: `<form id="reactivate-form" class="form" novalidate><p>${PM.esc(PM.t(expired ? 'reactivationExpired' : 'reactivateExplanation', { name: account.name }))}</p>${expired ? '' : choices}</form>`,
        footer: `<button class="button button-secondary" type="button" data-close>${PM.esc(PM.t('cancel'))}</button>${expired ? '' : `<button class="button button-primary" type="submit" form="reactivate-form" id="confirm-reactivate">${PM.esc(PM.t('reactivate'))}</button>`}`
      });
      const form = confirm.querySelector('#reactivate-form');
      const button = confirm.querySelector('#confirm-reactivate');
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const policy = form.querySelector('[name="missed-policy"]:checked')?.value;

        if (outstanding.length && !PM.fieldError(form.querySelector('#credit-missed'), policy ? '' : PM.t('chooseMissed'))) {
          return;
        }

        button.disabled = true;
        button.textContent = PM.t('saving');
        form.querySelector('.message-error')?.remove();

        try {
          await PM.request();

          if (policy === 'credit') {
            outstanding.forEach(item => account.history.push({ at: PROTOTYPE_NOW.toISOString(), type: 'allowance', amount: item.amount, allowanceMonth: item.month, by: 'automatic' }));
          } else if (policy === 'drop') {
            account.droppedAllowanceMonths = [...new Set([...(account.droppedAllowanceMonths ?? []), ...outstanding.map(item => item.month)])];
          }

          const failedPeriod = account.allowance.failedPeriod;
          const failedPeriodResolved = failedPeriod && (
            outstanding.some(item => item.month === failedPeriod) ||
            (account.droppedAllowanceMonths ?? []).includes(failedPeriod) ||
            account.history.some(entry => entry.type === 'allowance' && (entry.allowanceMonth ?? PM.businessMonth(entry.at)) === failedPeriod)
          );

          if (failedPeriodResolved) {
            delete account.allowance.failedPeriod;
          }

          delete account.purgeAtUtc;
          delete account.missedAllowanceMonths;
          PM.saveData();
          confirm.close();
          render();
          PM.toast(PM.t('reactivated', { name: account.name }));
        } catch {
          form.insertAdjacentHTML('afterbegin', `<div class="message message-error" role="alert">${PM.icon('error')}<div class="message-body">${PM.esc(PM.t('saveFailed'))}</div></div>`);
          button.disabled = false;
          button.textContent = PM.t('reactivate');
        }
      });
    }

    function renameAccount(account) {
      const editor = PM.dialog({
        title: PM.t('editNamed', { name: account.name }),
        body: `<form class="form" id="rename-form"><div class="field"><label for="account-name">${PM.esc(PM.t('name'))}</label><input class="input" id="account-name" maxlength="40" value="${PM.esc(account.name)}"><span class="hint">${PM.esc(PM.t('nameHint'))}</span></div></form>`,
        footer: `<button class="button button-secondary" type="button" data-close>${PM.esc(PM.t('cancel'))}</button><button class="button button-primary" type="submit" form="rename-form">${PM.esc(PM.t('save'))}</button>`
      });
      const input = editor.querySelector('#account-name');
      const save = editor.querySelector('[type="submit"]');
      editor.querySelector('form').addEventListener('submit', async event => {
        event.preventDefault();
        const name = input.value.trim();
        const taken = PM.data.accounts.some(item => item.id !== account.id && item.name.toLowerCase() === name.toLowerCase());

        if (!PM.fieldError(input, !name || name.length > 40 ? PM.t('nameInvalid') : taken ? PM.t('nameTaken') : '')) {
          return;
        }

        save.disabled = true;
        input.disabled = true;
        editor.querySelector('.message')?.remove();

        try {
          await PM.request();
          account.name = name;
          PM.saveData();
          editor.close();
          render();
          PM.toast(PM.t('nameSaved', { name }));
        } catch {
          editor.querySelector('.dialog-body').insertAdjacentHTML('afterbegin', `<div class="message message-error" role="alert">${PM.esc(PM.t('saveFailed'))}</div>`);
          save.disabled = false;
          input.disabled = false;
        }
      });
    }

    function allowancePanel(account) {
      const status = PM.allowanceStatus(account);
      const retired = Boolean(account.purgeAtUtc);
      let text = `<p class="muted" id="allowance-disabled">${PM.esc(PM.t('allowanceDisabled'))}</p>`;

      if (status.configured) {
        text = `<div class="allowance-state">${PM.icon('calendar')}<span>${PM.esc(PM.t(retired ? 'allowancePaused' : 'allowanceActive'))}</span></div><div class="allowance-amount">${PM.t('perMonth', { amount: PM.amountHtml(status.amount) })}</div>`;
      }

      const scheduled = account.allowanceScheduled;

      if (scheduled) {
        const month = new Intl.DateTimeFormat(PM.prefs.language === 'de' ? 'de-DE' : 'en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' }).format(new Date(`${scheduled.effectiveMonth ?? '2026-11'}-01T12:00:00Z`));

        if (scheduled.enabled) {
          const current = status.configured ? PM.t('allowanceCurrent', { amount: PM.amountHtml(status.amount) }) : PM.esc(PM.t('noAllowance'));
          text = `<div class="allowance-state">${PM.icon('calendar')}<span>${PM.esc(PM.t(retired ? 'allowancePaused' : 'allowanceScheduledTitle'))}</span></div><div class="allowance-amount">${PM.t('perMonth', { amount: PM.amountHtml(scheduled.amount) })}</div><p id="allowance-scheduled">${PM.esc(PM.t(retired ? 'allowanceSavedFrom' : 'allowanceStarts', { month }))}</p><p class="muted" id="allowance-current">${current}</p>`;
        } else if (status.configured) {
          text = `<div class="allowance-state" id="allowance-scheduled">${PM.icon('calendar')}<span>${PM.esc(PM.t('allowanceStops', { month }))}</span></div><p class="muted" id="allowance-current">${PM.t('allowanceCurrent', { amount: PM.amountHtml(status.amount) })}</p>`;
        }
      }

      const pausedNotice = retired
        ? `<div class="message message-info allowance-paused-notice" id="allowance-paused-reason" role="status">${PM.icon('info')}<div class="message-body">${PM.esc(PM.t('allowancePausedReason'))}</div></div>`
        : '';

      const credited = [...account.history].filter(entry => entry.type === 'allowance').sort((first, second) => new Date(second.at) - new Date(first.at))[0];
      const reviewState = PM.prefs.viewState;
      const creditPeriod = reviewState === 'credit-catch-up' ? '2026-09' : credited?.allowanceMonth;
      const periodNote = credited && creditPeriod && creditPeriod !== PM.businessMonth(credited.at)
        ? ` ${PM.esc(PM.t('creditForMonth', { month: creditPeriod }))}`
        : '';
      let execution = credited && reviewState !== 'no-credits'
        ? `<p class="allowance-credit" id="allowance-last-credit">${PM.icon('success')}<span>${PM.t('latestCredit', { date: PM.esc(PM.date(credited.at)) })}${periodNote}</span></p>`
        : `<p class="muted" id="allowance-no-credits">${PM.esc(PM.t('noCredits'))}</p>`;

      const fixtureFailed = reviewState === 'normal' && status.configured && !status.credited && status.failed;

      if (fixtureFailed || reviewState === 'credit-pending' || reviewState === 'credit-failed' || reviewState === 'credit-failure-detail') {
        const failed = reviewState !== 'credit-pending';
        const month = fixtureFailed ? account.allowance.failedPeriod : '2026-11';
        const statusKey = account.purgeAtUtc ? (failed ? 'creditFailedPaused' : 'creditPendingPaused') : (failed ? 'creditFailed' : 'creditPending');
        const reasonKey = reviewState === 'credit-failure-detail' ? 'creditFailureExample' : account.purgeAtUtc ? 'creditStoragePaused' : 'creditStorageFailed';
        execution += `<div class="message ${failed ? 'message-error allowance-failed' : 'message-info'}" id="allowance-outstanding" role="status">${PM.icon(failed ? 'error' : 'info')}<div class="message-body"><span>${PM.esc(PM.t(statusKey, { month }))}</span>${PM.isManager() ? `<p id="allowance-attempt-details">${PM.esc(PM.t('creditAttempt', { date: PM.date(`${month}-01T00:03:00Z`), attempts: 2 }))}</p>${failed ? `<p id="allowance-failure-reason">${PM.esc(PM.t(reasonKey))}</p>` : ''}` : ''}</div></div>`;
      }

      return `<div class="label" id="allowance-label">${PM.esc(PM.t('monthlyAllowance'))}</div>${pausedNotice}<div class="allowance"><div>${text}</div>${PM.isManager() && !account.purgeAtUtc ? `<button class="button button-secondary" type="button" id="set-allowance">${PM.icon('calendar')}${PM.esc(PM.t('setAllowance'))}</button>` : ''}</div><div class="allowance-execution" aria-labelledby="allowance-execution-title"><h3 id="allowance-execution-title">${PM.esc(PM.t('creditRuns'))}</h3>${execution}</div>`;
    }

    function formSection(account, balance) {
      if (account.purgeAtUtc) {
        return '';
      }

      if (!PM.isManager()) {
        return balance === null ? `<div class="message message-info">${PM.icon('info')}<div class="message-body">${PM.esc(PM.t('noOpeningMember'))}</div></div>` : '';
      }

      if (balance === null) {
        return `<section class="panel" aria-labelledby="opening-title"><h2 class="panel-title" id="opening-title">${PM.esc(PM.t('openingAmount'))}</h2>
          <form class="form" id="opening-form" novalidate>
            <p class="muted">${PM.esc(PM.t('openingIntro'))}</p>
            <div class="field"><label for="opening-amount">${PM.esc(PM.t('openingAmount'))}</label><div class="input-wrap"><input class="input" id="opening-amount" inputmode="decimal" autocomplete="off"><span class="input-suffix">EUR</span></div><span class="hint">${PM.esc(PM.t('openingHint'))}</span></div>
            <div class="field"><label for="opening-comment">${PM.esc(PM.t('comment'))}</label><input class="input" id="opening-comment" maxlength="500"></div>
            <button class="button button-primary button-block" type="submit">${PM.esc(PM.t('postOpening'))}</button>
          </form></section>`;
      }

      return '';
    }

    function transactionForm(prefix) {
      const typeOption = type => `<label><input type="radio" name="${prefix}-type" value="${type}" ${draft.type === type ? 'checked' : ''}><span>${PM.icon(type === 'deposit' ? 'plus' : 'minus')}${PM.esc(PM.t(type))}</span></label>`;
      return `<form class="form transaction-form" data-prefix="${prefix}" data-mode="${draft.type}" novalidate>
        <fieldset class="field"><legend class="visually-hidden">${PM.esc(PM.t('type'))}</legend><div class="segments segments-block">${typeOption('deposit')}${typeOption('withdrawal')}</div></fieldset>
        <div class="field"><label for="${prefix}-amount">${PM.esc(PM.t('amount'))}</label><div class="input-wrap"><span class="input-prefix" aria-hidden="true">${draft.type === 'deposit' ? '+' : '−'}</span><input class="input" id="${prefix}-amount" inputmode="decimal" autocomplete="off" value="${PM.esc(draft.amount)}"><span class="input-suffix">EUR</span></div><span class="hint">${PM.esc(PM.t('amountHint'))}</span></div>
        <div class="field"><label for="${prefix}-comment">${PM.esc(PM.t('comment'))}</label><textarea class="input" id="${prefix}-comment" maxlength="500">${PM.esc(draft.comment)}</textarea><span class="hint">${PM.esc(PM.t('commentHint'))}</span></div>
        <button class="button button-block mode-submit" type="submit">${submitLabel()}</button>
      </form>`;
    }

    function submitLabel() {
      return `${PM.icon(draft.type === 'deposit' ? 'plus' : 'minus')}${PM.esc(PM.t(draft.type === 'deposit' ? 'recordDeposit' : 'recordWithdrawal'))}`;
    }

    function history(account) {
      const entries = [...account.history].sort((a, b) => new Date(b.at) - new Date(a.at));

      if (!entries.length) {
        return `<div class="empty">${PM.esc(PM.t('noTransactions'))}</div>`;
      }

      const pages = Math.ceil(entries.length / PAGE_SIZE);
      page = Math.min(page, pages - 1);
      const rows = entries.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE).map(entry => {
        const by = entry.by === 'automatic' ? PM.t('automatic') : entry.by;
        const comment = entry.comment ? PM.esc(entry.comment) : entry.type === 'allowance' ? PM.esc(PM.t('allowanceComment')) : `<span class="wide-only muted">—</span><span class="phone-only">${PM.esc(PM.t(entry.type))}</span>`;
        return `<tr><td class="numeric">${PM.amountHtml(entry.amount)}</td><td class="type"><span class="type-label">${PM.esc(PM.t(entry.type))}</span></td><td class="comment">${comment}</td><td class="by">${PM.esc(by)}</td><td class="meta">${PM.esc(PM.date(entry.at, false))} · ${PM.esc(by)}</td><td class="date">${PM.esc(PM.date(entry.at))}</td></tr>`;
      }).join('');
      return `<div class="table-wrap"><table class="table"><thead><tr><th class="numeric">${PM.esc(PM.t('amount'))}</th><th>${PM.esc(PM.t('type'))}</th><th>${PM.esc(PM.t('commentHeader'))}</th><th>${PM.esc(PM.t('postedBy'))}</th><th>${PM.esc(PM.t('date'))}</th></tr></thead><tbody>${rows}</tbody></table></div>
        <nav class="pager" aria-label="${PM.esc(PM.t('pages'))}"><button class="button button-secondary" type="button" id="previous" ${page === 0 ? 'disabled' : ''}>${PM.icon('left')}${PM.esc(PM.t('previous'))}</button><span>${PM.esc(PM.t('pageOf', { page: page + 1, pages }))}</span><button class="button button-secondary" type="button" id="next" ${page >= pages - 1 ? 'disabled' : ''}>${PM.esc(PM.t('next'))}${PM.icon('right')}</button></nav>`;
    }

    function bind(account, balance) {
      document.getElementById('previous')?.addEventListener('click', () => { page--; render(); document.getElementById('history-title').scrollIntoView(); });
      document.getElementById('next')?.addEventListener('click', () => { page++; render(); document.getElementById('history-title').scrollIntoView(); });
      document.getElementById('set-allowance')?.addEventListener('click', () => openAllowance(account));
      document.getElementById('edit-image')?.addEventListener('click', () => openImage(account));
      document.getElementById('opening-form')?.addEventListener('submit', event => submitOpening(event, account));
      document.getElementById('record-transaction')?.addEventListener('click', () => {
        const recordDialog = PM.dialog({ title: PM.t('recordTransaction'), body: transactionForm('dialog') });
        bindTransaction(recordDialog.querySelector('form'), account, recordDialog);
      });
    }

    function bindTransaction(form, account, container) {
      const prefix = form.dataset.prefix;
      const amount = form.querySelector(`#${prefix}-amount`);
      const comment = form.querySelector(`#${prefix}-comment`);
      const submit = form.querySelector('[type="submit"]');
      form.addEventListener('input', () => {
        draft = { type: form.querySelector(`[name="${prefix}-type"]:checked`).value, amount: amount.value, comment: comment.value };
        form.dataset.mode = draft.type;
        form.querySelector('.input-prefix').textContent = draft.type === 'deposit' ? '+' : '\u2212';
        submit.innerHTML = submitLabel();
      });
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const minor = PM.parseAmount(amount.value);

        if (!PM.fieldError(amount, minor === null || minor === 0 ? PM.t('amountInvalid') : '')) {
          amount.focus();
          return;
        }

        submit.disabled = true;
        submit.textContent = PM.t('saving');
        form.querySelector('.message')?.remove();

        try {
          await PM.request();
          const signed = draft.type === 'withdrawal' ? -minor : minor;
          account.history.push({ at: new Date().toISOString(), type: draft.type, amount: signed, comment: comment.value.trim(), by: PM.currentUser().displayName });
          PM.saveData();
          const type = draft.type;
          draft = { type, amount: '', comment: '' };
          container?.close();
          page = 0;
          render();
          PM.toast(PM.t(type === 'deposit' ? 'deposited' : 'withdrawn', { amount: PM.money(minor, { signed: false }).text, name: account.name }));
        } catch {
          form.insertAdjacentHTML('afterbegin', `<div class="message message-error" role="alert">${PM.icon('error')}<div class="message-body">${PM.esc(PM.t('saveFailed'))}</div></div>`);
          submit.disabled = false;
          submit.innerHTML = submitLabel();
        }
      });
    }

    function submitOpening(event, account) {
      event.preventDefault();
      const form = event.currentTarget;
      const amount = form.querySelector('#opening-amount');
      const comment = form.querySelector('#opening-comment');
      const minor = PM.parseAmount(amount.value, { signed: true });

      if (!PM.fieldError(amount, minor === null ? PM.t('openingInvalid') : '')) {
        amount.focus();
        return;
      }

      const confirm = PM.dialog({
        title: PM.t('confirmOpeningTitle'),
        body: `<p>${PM.t('confirmOpening', { amount: PM.amountHtml(minor), name: PM.esc(account.name) })}</p>`,
        footer: `<button class="button button-secondary" type="button" data-close>${PM.esc(PM.t('cancel'))}</button><button class="button button-primary" type="button" id="confirm-opening">${PM.esc(PM.t('postOpening'))}</button>`
      });
      const button = confirm.querySelector('#confirm-opening');
      button.focus();
      button.addEventListener('click', async () => {
        button.disabled = true;
        button.textContent = PM.t('saving');

        try {
          await PM.request();
          account.history.push({ at: new Date().toISOString(), type: 'opening', amount: minor, comment: comment.value.trim(), by: PM.currentUser().displayName });
          PM.saveData();
          confirm.close();
          render();
          PM.toast(PM.t('openingPosted'));
        } catch {
          confirm.close();
          form.insertAdjacentHTML('afterbegin', `<div class="message message-error" role="alert">${PM.icon('error')}<div class="message-body">${PM.esc(PM.t('saveFailed'))}</div></div>`);
        }
      });
    }

    function openImage(account) {
      let image = account.image ?? null;
      const editor = PM.dialog({
        title: PM.t('accountImage'),
        body: `<div class="image-field"><span id="image-preview"></span><div class="actions"><label class="button button-secondary">${PM.icon('plus')}${PM.esc(PM.t('upload'))}<input class="visually-hidden" type="file" accept="image/png, image/jpeg, image/webp" id="image-input"></label><button class="button button-link" type="button" id="image-remove">${PM.esc(PM.t('removeImage'))}</button></div></div><span class="hint">${PM.esc(PM.t('imageHint'))}</span>`,
        footer: `<button class="button button-secondary" type="button" data-close>${PM.esc(PM.t('cancel'))}</button><button class="button button-primary" type="button" id="image-save">${PM.esc(PM.t('save'))}</button>`
      });
      const save = editor.querySelector('#image-save');
      const show = () => {
        editor.querySelector('#image-preview').innerHTML = PM.avatar({ name: account.name, image });
        editor.querySelector('#image-remove').hidden = !image;
      };
      show();
      editor.querySelector('#image-input').focus();
      editor.querySelector('#image-input').addEventListener('change', event => {
        const file = event.target.files[0];

        if (file) {
          const reader = new FileReader();
          reader.addEventListener('load', () => {
            image = reader.result;
            show();
          });
          reader.readAsDataURL(file);
        }
      });
      editor.querySelector('#image-remove').addEventListener('click', () => {
        image = null;
        show();
      });
      save.addEventListener('click', async () => {
        save.disabled = true;
        save.textContent = PM.t('saving');
        editor.querySelector('.message-error')?.remove();

        try {
          await PM.request();
          account.image = image;
          PM.saveData();
          editor.close();
          render();
          PM.toast(PM.t('imageSaved', { name: account.name }));
        } catch {
          editor.querySelector('.dialog-body').insertAdjacentHTML('afterbegin', `<div class="message message-error" role="alert">${PM.icon('error')}<div class="message-body">${PM.esc(PM.t('saveFailed'))}</div></div>`);
          save.disabled = false;
          save.textContent = PM.t('save');
        }
      });
    }

    function openAllowance(account) {
      const latest = account.allowanceScheduled ?? account.allowance;
      let enabled = latest.enabled;
      const editor = PM.dialog({
        title: PM.t('setAllowance'),
        body: `<form class="form" id="allowance-form" novalidate>
          <div class="switch-row"><span class="field-label" id="allowance-enabled-label">${PM.esc(PM.t('allowanceEnabled'))}</span><button class="switch" type="button" role="switch" id="allowance-enabled" aria-labelledby="allowance-enabled-label" aria-checked="${enabled}"></button></div>
          <div id="allowance-settings"${enabled ? '' : ' hidden'}>
            <div class="field"><label for="allowance-amount">${PM.esc(PM.t('amountPerMonth'))}</label><div class="input-wrap"><input class="input" id="allowance-amount" inputmode="decimal" autocomplete="off" value="${latest.amount ? (latest.amount / 100).toFixed(2) : ''}"><span class="input-suffix">EUR</span></div><span class="hint">${PM.esc(PM.t('allowanceHint'))}</span></div>
            <div class="message message-info">${PM.icon('info')}<div class="message-body">${PM.esc(PM.t('allowanceInfo'))}</div></div>
          </div>
        </form>`,
        footer: `<button class="button button-secondary" type="button" data-close>${PM.esc(PM.t('cancel'))}</button><button class="button button-primary" type="submit" form="allowance-form" id="allowance-save">${PM.esc(PM.t('save'))}</button>`
      });
      const toggle = editor.querySelector('#allowance-enabled');
      const amount = editor.querySelector('#allowance-amount');
      const save = editor.querySelector('#allowance-save');
      const sync = () => {
        toggle.setAttribute('aria-checked', String(enabled));
        editor.querySelector('#allowance-settings').hidden = !enabled;
        amount.disabled = !enabled;
      };
      sync();
      toggle.focus();
      toggle.addEventListener('click', () => {
        enabled = !enabled;
        sync();
      });
      editor.querySelector('form').addEventListener('submit', async event => {
        event.preventDefault();
        const minor = enabled ? PM.parseAmount(amount.value) : latest.amount;

        if (enabled && !PM.fieldError(amount, minor === null || minor === 0 ? PM.t('allowanceInvalid') : '')) {
          amount.focus();
          return;
        }

        save.disabled = true;
        save.textContent = PM.t('saving');
        editor.querySelector('.message-error')?.remove();

        try {
          await PM.request();
          account.allowanceScheduled = { enabled, amount: minor };
          PM.saveData();
          editor.close();
          render();
          PM.toast(PM.t(enabled ? 'allowanceSaved' : 'allowanceOff', { name: account.name }));
        } catch {
          editor.querySelector('.dialog-body').insertAdjacentHTML('afterbegin', `<div class="message message-error" role="alert">${PM.icon('error')}<div class="message-body">${PM.esc(PM.t('saveFailed'))}</div></div>`);
          save.disabled = false;
          save.textContent = PM.t('save');
        }
      });
    }
