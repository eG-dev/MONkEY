<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POCKET MONkEY</title>
  <link rel="stylesheet" href="../../design-system/styles.css">
  <link rel="stylesheet" href="../shared/prototype.css">
  <style>
    .name-cell { display: flex; align-items: center; gap: var(--space-4); font-weight: var(--weight-medium); }
    @media (max-width: 599px) {
      .table thead { display: none; }
      .table tr { display: grid; grid-template-columns: 1fr auto; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); }
      .table td { border: 0; padding: 4px 8px; }
      .table td.status { grid-column: 1; color: var(--text-secondary); font: var(--type-caption); }
      .table td.numeric { grid-column: 2; grid-row: 1; }
      .table td.actions-cell { grid-column: 2; grid-row: 2; text-align: end; }
      .actions-cell .button-link span { display: none; }
    }
  </style>
</head>
<body>
  <div id="view"></div>
  <script src="../shared/data.js"></script>
  <script src="../shared/prototype.js"></script>
  <script>
    const view = document.getElementById('view');

    function render() {
      if (!PM.isManager()) {
        view.innerHTML = `<div class="message message-info">${PM.icon('info')}<div class="message-body"><span>${PM.esc(PM.t('managersOnly'))}</span><a href="../accounts-overview/index.html">${PM.esc(PM.t('toOverview'))}</a></div></div>`;
        return;
      }

      const rows = PM.accountsByName().map(account => {
        const balance = PM.balance(account);
        return `<tr class="clickable" data-account="${account.id}">
          <td><span class="name-cell">${PM.avatar(account, true)}<a href="../account-details/index.html?account=${account.id}">${PM.esc(account.name)}</a></span></td>
          <td class="numeric">${balance === null ? '–' : PM.amountHtml(balance)}</td>
          <td class="status">${PM.esc(balance === null ? PM.t('notInitialized') : PM.t('active'))}</td>
          <td class="actions-cell"><button class="button button-link" type="button" data-edit="${account.id}" aria-label="${PM.esc(PM.t('editNamed', { name: account.name }))}">${PM.icon('pencil')}<span>${PM.esc(PM.t('edit'))}</span></button></td>
        </tr>`;
      }).join('');
      view.innerHTML = `<div class="page-header"><h1 class="page-title">${PM.esc(PM.t('accounts'))}</h1><button class="button button-primary" type="button" id="create">${PM.icon('plus')}${PM.esc(PM.t('create'))}</button></div>
        <div class="table-wrap"><table class="table"><thead><tr><th>${PM.esc(PM.t('name'))}</th><th class="numeric">${PM.esc(PM.t('balance'))}</th><th>${PM.esc(PM.t('status'))}</th><th><span class="visually-hidden">${PM.esc(PM.t('actions'))}</span></th></tr></thead><tbody>${rows}</tbody></table></div>`;
      document.getElementById('create').addEventListener('click', () => openEditor());
      view.querySelectorAll('[data-edit]').forEach(button => button.addEventListener('click', event => {
        event.stopPropagation();
        openEditor(PM.account(button.dataset.edit));
      }));
      view.querySelectorAll('tr[data-account]').forEach(row => row.addEventListener('click', event => {
        if (!event.target.closest('a, button')) {
          location.href = `../account-details/index.html?account=${row.dataset.account}`;
        }
      }));
    }

    function openEditor(account) {
      const creating = !account;
      const editor = PM.dialog({
        title: creating ? PM.t('create') : PM.t('editNamed', { name: account.name }),
        body: `<form class="form" id="account-form" novalidate>
          <div class="field"><label for="account-name">${PM.esc(PM.t('name'))}</label><input class="input" id="account-name" maxlength="60" autocomplete="off" value="${PM.esc(account?.name ?? '')}"><span class="hint">${PM.esc(PM.t('nameHint'))}</span></div>
        </form>`,
        footer: `<button class="button button-secondary" type="button" data-close>${PM.esc(PM.t('cancel'))}</button><button class="button button-primary" type="submit" form="account-form" id="account-save">${PM.esc(creating ? PM.t('create') : PM.t('save'))}</button>`
      });
      const input = editor.querySelector('#account-name');
      const save = editor.querySelector('#account-save');
      input.focus();
      editor.querySelector('form').addEventListener('submit', async event => {
        event.preventDefault();
        const name = input.value.trim();
        const taken = PM.data.accounts.some(item => item !== account && item.name.toLowerCase() === name.toLowerCase());

        if (!PM.fieldError(input, !name || name.length > 40 ? PM.t('nameInvalid') : taken ? PM.t('nameTaken') : '')) {
          input.focus();
          return;
        }

        save.disabled = true;
        save.textContent = PM.t('saving');
        editor.querySelector('.message')?.remove();

        try {
          await PM.request();

          if (creating) {
            PM.data.accounts.push({ id: `account-${Date.now()}`, name, allowance: { enabled: false, amount: 0 }, history: [] });
          } else {
            account.name = name;
          }

          PM.saveData();
          editor.close();
          render();
          PM.toast(PM.t(creating ? 'created' : 'saved', { name }));
        } catch {
          editor.querySelector('.dialog-body').insertAdjacentHTML('afterbegin', `<div class="message message-error" role="alert">${PM.icon('error')}<div class="message-body">${PM.esc(PM.t('saveFailed'))}</div></div>`);
          save.disabled = false;
          save.textContent = creating ? PM.t('create') : PM.t('save');
        }
      });
    }

    PM.init({
      active: 'accounts',
      title: 'accounts',
      render,
      strings: {
        en: { managersOnly: 'Only Managers can manage accounts.', toOverview: 'Go to the overview', create: 'Create account', name: 'Name', balance: 'Balance', status: 'Status', actions: 'Actions', active: 'Active', edit: 'Edit', editNamed: 'Edit {name}', nameHint: '1–40 characters, unique', nameInvalid: 'Enter a name with 1–40 characters.', nameTaken: 'An account with this name already exists.', created: 'Account {name} created.', saved: 'Account {name} saved.' },
        de: { managersOnly: 'Nur Manager können Konten verwalten.', toOverview: 'Zur Übersicht', create: 'Konto anlegen', name: 'Name', balance: 'Kontostand', status: 'Status', actions: 'Aktionen', active: 'Aktiv', edit: 'Bearbeiten', editNamed: '{name} bearbeiten', nameHint: '1–40 Zeichen, eindeutig', nameInvalid: 'Einen Namen mit 1–40 Zeichen eingeben.', nameTaken: 'Ein Konto mit diesem Namen existiert bereits.', created: 'Konto {name} angelegt.', saved: 'Konto {name} gespeichert.' }
      }
    });
  </script>
</body>
</html>
