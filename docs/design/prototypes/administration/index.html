<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POCKET MONkEY</title>
  <link rel="stylesheet" href="../../design-system/styles.css">
  <link rel="stylesheet" href="../shared/prototype.css">
  <style>
    .profile { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 560px)); gap: var(--space-7); align-items: start; }
    .profile .panel + .panel { margin-top: 0; }
    .facts { display: grid; grid-template-columns: max-content 1fr; gap: 12px 24px; margin: 0 0 var(--space-5); }
    .facts dt { color: var(--text-secondary); }
    .facts dd { margin: 0; }
    .temporary { display: flex; gap: var(--space-3); align-items: center; }
    .temporary code { flex: 1; padding: 8px 12px; border: 0; border-radius: var(--radius-sm); background: var(--surface-input); font: var(--type-h3); font-family: var(--font-mono); letter-spacing: .04em; }
    .status-disabled, .status-mustChange { color: var(--text-secondary); }
    .users-table { table-layout: fixed; }
    .users-table th, .users-table td { overflow-wrap: anywhere; white-space: normal; }
    .users-table th:nth-child(1) { width: 18%; }
    .users-table th:nth-child(2) { width: 13%; }
    .users-table th:nth-child(3) { width: 12%; }
    .users-table th:nth-child(4) { width: 17%; }
    .users-table th:nth-child(5) { width: 27%; }
    .users-table th:nth-child(6) { width: 13%; }
    .assigned-summary { display: flex; align-items: center; gap: var(--space-2); }
    .assigned-summary > span { flex: 1; min-width: 0; }
    .assigned-summary .icon-button { flex-shrink: 0; }
    .assignment-mobile-label { display: none; }
    .assignment-dialog[open] { display: flex; flex-direction: column; }
    .assignment-dialog .dialog-header, .assignment-dialog .dialog-footer { flex-shrink: 0; }
    .assignment-dialog .dialog-header h2 { overflow-wrap: anywhere; min-width: 0; }
    .assignment-dialog .dialog-body { overflow: auto; min-height: 0; }
    .assignment-options { display: grid; gap: var(--space-2); max-height: calc(var(--control-lg) * 5); overflow: auto; padding: 0; border: 0; }
    .assignment-options legend { font: var(--type-label); margin-bottom: var(--space-3); }
    .assignment-option { display: flex; align-items: center; gap: var(--space-3); min-height: var(--control-lg); padding: var(--space-2); border-radius: var(--radius-sm); overflow-wrap: anywhere; cursor: pointer; }
    .assignment-option:hover { background: var(--surface-hover); }
    .assignment-option input { appearance: none; display: grid; place-content: center; flex-shrink: 0; width: var(--space-5); height: var(--space-5); margin: 0; border: 2px solid var(--action-primary); border-radius: var(--radius-sm); background: var(--surface-input); cursor: inherit; }
    .assignment-option input::before { content: ''; width: 6px; height: 10px; border: solid var(--action-primary-text); border-width: 0 2px 2px 0; transform: rotate(45deg) scale(0); }
    .assignment-option input:checked { background: var(--action-primary); }
    .assignment-option input:checked::before { transform: rotate(45deg) scale(1); }
    .assignment-option input:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 3px; }
    .assignment-option:has(input:disabled) { color: var(--text-disabled); cursor: not-allowed; }
    .assignment-option input:disabled { border-color: var(--text-disabled); background: var(--surface-sunken); }
    .assignment-option input:disabled::before { border-color: var(--text-disabled); }
    @media (forced-colors: active) {
      .assignment-option input { appearance: auto; }
      .assignment-option input::before { content: none; }
    }
    @media (max-width: 599px) {
      .table thead { display: none; }
      .table tr { display: grid; grid-template-columns: 1fr auto; padding: 8px 0; }
      .table td { border: 0; padding: 2px 4px; }
      .table td.user-name { font-weight: var(--weight-medium); }
      .table td.username, .table td.role, .table td.status-cell { grid-column: 1; font: var(--type-caption); color: var(--text-secondary); }
      .table td.actions-cell { grid-column: 2; grid-row: 1 / 5; align-self: center; }
      .table .row-actions { flex-direction: column; align-items: flex-end; }
      .table td.assignments-cell { grid-column: 1 / -1; padding-top: var(--space-3); }
      .assignment-mobile-label { display: block; font: var(--type-caption); color: var(--text-secondary); }
    }
  </style>
</head>
<body>
  <div id="view"></div>
  <script src="../shared/data.js"></script>
  <script src="../shared/prototype.js"></script>
  <script>
    const view = document.getElementById('view');
    const statusLabel = user => PM.t(`status_${user.status}`);
    const activeManagers = () => PM.data.users.filter(user => user.role === 'Manager' && user.status !== 'disabled');
    const isLastManager = user => user.role === 'Manager' && user.status !== 'disabled' && activeManagers().length === 1;

    function tab() {
      return location.hash === '#users' && PM.isManager() ? 'users' : 'profile';
    }

    function render() {
      const current = tab();
      const tabs = `<nav class="tabs" aria-label="${PM.esc(PM.t('administration'))}"><a href="#profile" ${current === 'profile' ? 'aria-current="page"' : ''}>${PM.esc(PM.t('profile'))}</a>${PM.isManager() ? `<a href="#users" ${current === 'users' ? 'aria-current="page"' : ''}>${PM.esc(PM.t('users'))}</a>` : ''}</nav>`;
      view.innerHTML = `<div class="page-header"><h1 class="page-title">${PM.esc(PM.t('administration'))}</h1></div>${tabs}${current === 'users' ? users() : profile()}`;
      current === 'users' ? bindUsers() : bindProfile();
    }

    // ---------- Profile ----------
    function profile() {
      const user = PM.currentUser();
      return `<div class="profile">
        <section class="panel" aria-labelledby="account-title"><h2 class="panel-title" id="account-title">${PM.esc(PM.t('account'))}</h2>
          <dl class="facts"><dt>${PM.esc(PM.t('displayName'))}</dt><dd>${PM.esc(user.displayName)}</dd><dt>${PM.esc(PM.t('username'))}</dt><dd>${PM.esc(user.username)}</dd><dt>${PM.esc(PM.t('role'))}</dt><dd>${PM.esc(PM.t(user.role))}</dd></dl>
          <button class="button button-secondary" type="button" id="change-password">${PM.icon('key')}${PM.esc(PM.t('changePassword'))}</button>
        </section>
        <section class="panel" aria-labelledby="preferences-title"><h2 class="panel-title" id="preferences-title">${PM.esc(PM.t('preferences'))}</h2>
          <div class="form">
            <div class="field"><label for="language">${PM.esc(PM.t('language'))}</label><select class="select" id="language"><option value="de" ${PM.prefs.language === 'de' ? 'selected' : ''}>Deutsch</option><option value="en" ${PM.prefs.language === 'en' ? 'selected' : ''}>English</option></select></div>
            <div class="switch-row"><span class="field-label" id="dark-label">${PM.esc(PM.t('darkMode'))}</span><button class="switch" type="button" role="switch" id="dark-switch" aria-labelledby="dark-label" aria-checked="${PM.prefs.dark}"></button></div>
          </div>
        </section>
      </div>`;
    }

    function bindProfile() {
      document.getElementById('language').addEventListener('change', event => {
        PM.savePrefs({ language: event.target.value });
        document.getElementById('language').focus();
        PM.toast(PM.t('preferencesSaved'));
      });
      document.getElementById('dark-switch').addEventListener('click', () => {
        PM.savePrefs({ dark: !PM.prefs.dark });
        document.getElementById('dark-switch').focus();
      });
      document.getElementById('change-password').addEventListener('click', openChangePassword);
    }

    function openChangePassword() {
      const editor = PM.dialog({
        title: PM.t('changePassword'),
        body: `<form class="form" id="password-form" novalidate>
          <div class="field"><label for="current-password">${PM.esc(PM.t('currentPassword'))}</label><input class="input" type="password" id="current-password" autocomplete="current-password"></div>
          <div class="field"><label for="new-password">${PM.esc(PM.t('newPassword'))}</label><input class="input" type="password" id="new-password" autocomplete="new-password"><span class="hint">${PM.esc(PM.t('passwordHint'))}</span></div>
          <div class="field"><label for="confirm-password">${PM.esc(PM.t('confirmPassword'))}</label><input class="input" type="password" id="confirm-password" autocomplete="new-password" required></div>
          <div class="message message-info">${PM.icon('info')}<div class="message-body">${PM.esc(PM.t('sessionsEnd'))}</div></div>
        </form>`,
        footer: `<button class="button button-secondary" type="button" data-close>${PM.esc(PM.t('cancel'))}</button><button class="button button-primary" type="submit" form="password-form" id="password-save">${PM.esc(PM.t('changePassword'))}</button>`
      });
      const current = editor.querySelector('#current-password');
      const next = editor.querySelector('#new-password');
      const confirmation = editor.querySelector('#confirm-password');
      const save = editor.querySelector('#password-save');
      current.focus();
      editor.querySelector('form').addEventListener('submit', async event => {
        event.preventDefault();
        const currentOk = PM.fieldError(current, !current.value ? PM.t('required') : current.value === 'wrong' ? PM.t('currentWrong') : '');
        const nextOk = PM.fieldError(next, next.value.length < 12 ? PM.t('passwordShort') : '');
        const confirmationOk = PM.fieldError(confirmation, !confirmation.value ? PM.t('required') : confirmation.value !== next.value ? PM.t('passwordMismatch') : '');

        if (!currentOk || !nextOk || !confirmationOk) {
          (!currentOk ? current : !nextOk ? next : confirmation).focus();
          return;
        }

        save.disabled = true;
        save.textContent = PM.t('saving');

        try {
          await PM.request();
          location.href = '../login/index.html?signedout=password';
        } catch {
          editor.querySelector('.dialog-body').insertAdjacentHTML('afterbegin', `<div class="message message-error" role="alert">${PM.icon('error')}<div class="message-body">${PM.esc(PM.t('saveFailed'))}</div></div>`);
          save.disabled = false;
          save.textContent = PM.t('changePassword');
        }
      });
    }

    // ---------- Users ----------
    function users() {
      const rows = [...PM.data.users].sort((a, b) => a.displayName.localeCompare(b.displayName)).map(user => `<tr>
        <td class="user-name">${PM.esc(user.displayName)}</td><td class="username">${PM.esc(user.username)}</td><td class="role">${PM.esc(PM.t(user.role))}</td>
        <td class="status-cell status-${user.status}">${PM.esc(statusLabel(user))}</td>
        <td class="assignments-cell"><span class="assignment-mobile-label">${PM.esc(PM.t('assignedAccounts'))}</span><div class="assigned-summary"><span>${PM.esc(user.role === 'Manager' ? PM.t('allAccounts') : assignedAccountNames(user))}</span>${user.role === 'Member' ? `<button class="icon-button" type="button" data-assignments="${PM.esc(user.id)}" aria-label="${PM.esc(PM.t('assignmentsNamed', { name: user.displayName }))}" title="${PM.esc(PM.t('assignmentsNamed', { name: user.displayName }))}">${PM.icon('pencil')}</button>` : ''}</div></td>
        <td class="actions-cell"><span class="row-actions"><button class="icon-button" type="button" data-edit="${user.id}" aria-label="${PM.esc(PM.t('editNamed', { name: user.displayName }))}" title="${PM.esc(PM.t('editNamed', { name: user.displayName }))}">${PM.icon('pencil')}</button><button class="icon-button" type="button" data-reset="${user.id}" aria-label="${PM.esc(PM.t('resetNamed', { name: user.displayName }))}" title="${PM.esc(PM.t('resetNamed', { name: user.displayName }))}">${PM.icon('key')}</button></span></td>
      </tr>`).join('');
      return `<div class="page-header"><span></span><button class="button button-primary" type="button" id="create-user">${PM.icon('plus')}${PM.esc(PM.t('createUser'))}</button></div>
        <div class="table-wrap"><table class="table users-table"><thead><tr><th>${PM.esc(PM.t('displayName'))}</th><th>${PM.esc(PM.t('username'))}</th><th>${PM.esc(PM.t('role'))}</th><th>${PM.esc(PM.t('status'))}</th><th>${PM.esc(PM.t('assignedAccounts'))}</th><th><span class="visually-hidden">${PM.esc(PM.t('actions'))}</span></th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function assignedAccountNames(user) {
      return PM.data.accounts.filter(account => !account.purgeAtUtc && (user.accountIds ?? []).includes(account.id))
        .sort((first, second) => first.name.localeCompare(second.name))
        .map(account => account.name).join(', ') || PM.t('noAssignedAccounts');
    }

    function bindUsers() {
      document.getElementById('create-user').addEventListener('click', openCreateUser);
      view.querySelectorAll('[data-assignments]').forEach(button => button.addEventListener('click', () => openAssignments(button.dataset.assignments)));
      view.querySelectorAll('[data-edit]').forEach(button => button.addEventListener('click', () => openEditUser(PM.data.users.find(user => user.id === button.dataset.edit))));
      view.querySelectorAll('[data-reset]').forEach(button => button.addEventListener('click', () => confirmReset(PM.data.users.find(user => user.id === button.dataset.reset))));
    }

    function openAssignments(userId) {
      const target = () => PM.data.users.find(user => user.id === userId);
      let version;
      let submitting = false;
      let ready = false;
      let reviewState = PM.prefs.viewState;
      const editor = PM.dialog({
        title: PM.t('assignmentsNamed', { name: target().displayName }),
        body: '<form class="form" id="assignments-form"><div id="assignments-feedback"></div><div id="assignments-list"></div></form>',
        footer: `<button class="button button-secondary" type="button" data-close>${PM.esc(PM.t('cancel'))}</button><button class="button button-primary" type="submit" form="assignments-form" id="assignments-save" disabled>${PM.esc(PM.t('save'))}</button>`
      });
      editor.classList.add('assignment-dialog');
      const save = editor.querySelector('#assignments-save');
      const list = editor.querySelector('#assignments-list');
      const feedback = editor.querySelector('#assignments-feedback');

      function showError(key) {
        ready = false;
        save.disabled = true;
        feedback.innerHTML = `<div class="message message-error" role="alert">${PM.icon('error')}<div class="message-body"><span>${PM.esc(PM.t(key))}</span><button class="button button-secondary" type="button" id="assignments-reload">${PM.icon('refresh')}${PM.esc(PM.t('reloadAssignments'))}</button></div></div>`;
        feedback.querySelector('button').addEventListener('click', () => {
          if (key === 'assignmentsNotMember') {
            editor.close();
            render();
            return;
          }

          reviewState = 'normal';
          loadAssignments();
        });
      }

      async function loadAssignments() {
        ready = false;
        save.disabled = true;
        feedback.innerHTML = '';
        list.innerHTML = `<p role="status" aria-busy="true">${PM.esc(PM.t('assignmentsLoading'))}</p>`;

        if (reviewState === 'loading') {
          return;
        }

        await new Promise(resolve => setTimeout(resolve, 200));

        if (!editor.isConnected) {
          return;
        }

        if (reviewState === 'error') {
          list.innerHTML = '';
          showError('assignmentsLoadFailed');
          return;
        }

        if (!PM.isManager() || !target() || target().role !== 'Member') {
          list.innerHTML = '';
          showError('assignmentsNotMember');
          return;
        }

        version = target().assignmentsVersion;
        const accounts = reviewState === 'empty' ? [] : PM.accountsByName();
        list.innerHTML = accounts.length ? `<fieldset class="assignment-options"><legend>${PM.esc(PM.t('assignedAccounts'))}</legend>${accounts.map(account => `<label class="assignment-option"><input type="checkbox" name="accountIds" value="${PM.esc(account.id)}" ${(target().accountIds ?? []).includes(account.id) ? 'checked' : ''}><span>${PM.esc(account.name)}</span></label>`).join('')}</fieldset>` : `<p>${PM.esc(PM.t('noActiveAccounts'))}</p>`;
        ready = true;
        save.disabled = false;
      }

      editor.addEventListener('cancel', event => {
        if (submitting) {
          event.preventDefault();
        }
      });
      editor.querySelector('form').addEventListener('submit', async event => {
        event.preventDefault();

        if (!ready || submitting) {
          return;
        }

        const selected = [...editor.querySelectorAll('[name="accountIds"]:checked')].map(input => input.value).sort();
        submitting = true;
        save.disabled = true;
        save.textContent = PM.t('saving');
        editor.querySelectorAll('input, [data-close]').forEach(control => control.disabled = true);

        try {
          await PM.request();

          if (!PM.isManager() || !target() || target().role !== 'Member' || reviewState === 'not-member') {
            showError('assignmentsNotMember');
          } else if (target().assignmentsVersion !== version || reviewState === 'conflict') {
            showError('assignmentsConflict');
          } else if (selected.some(id => !PM.data.accounts.some(account => account.id === id && !account.purgeAtUtc)) || reviewState === 'unavailable') {
            showError('assignmentUnavailable');
          } else {
            if (JSON.stringify([...(target().accountIds ?? [])].sort()) !== JSON.stringify(selected)) {
              target().accountIds = selected;
              target().assignmentsVersion = crypto.randomUUID();
            }

            PM.saveData();
            editor.close();
            render();
            [...view.querySelectorAll('[data-assignments]')].find(button => button.dataset.assignments === userId)?.focus();
            PM.toast(PM.t('assignmentsSaved'));
          }
        } catch {
          showError('assignmentsSaveFailed');
        } finally {
          submitting = false;
          save.textContent = PM.t('save');
          editor.querySelectorAll('input, [data-close]').forEach(control => control.disabled = false);
          save.disabled = !ready;
        }
      });
      loadAssignments();
    }

    const roleSegments = (selected, disableMember = false) => `<fieldset class="field"><legend class="field-label">${PM.esc(PM.t('role'))}</legend><div class="segments">
      <label><input type="radio" name="role" value="Member" ${selected === 'Member' ? 'checked' : ''} ${disableMember ? 'disabled' : ''}><span>${PM.esc(PM.t('Member'))}</span></label>
      <label><input type="radio" name="role" value="Manager" ${selected === 'Manager' ? 'checked' : ''}><span>${PM.esc(PM.t('Manager'))}</span></label></div></fieldset>`;

    function failure(editor, button, label) {
      editor.querySelector('.dialog-body').insertAdjacentHTML('afterbegin', `<div class="message message-error" role="alert">${PM.icon('error')}<div class="message-body">${PM.esc(PM.t('saveFailed'))}</div></div>`);
      button.disabled = false;
      button.textContent = label;
    }

    function openCreateUser() {
      const editor = PM.dialog({
        title: PM.t('createUser'),
        body: `<form class="form" id="user-form" novalidate>
          <div class="field"><label for="new-username">${PM.esc(PM.t('username'))}</label><input class="input" id="new-username" autocomplete="off" autocapitalize="none"><span class="hint">${PM.esc(PM.t('usernameHint'))}</span></div>
          <div class="field"><label for="new-display">${PM.esc(PM.t('displayName'))}</label><input class="input" id="new-display" maxlength="120"><span class="hint">${PM.esc(PM.t('displayHint'))}</span></div>
          ${roleSegments('Member')}
        </form>`,
        footer: `<button class="button button-secondary" type="button" data-close>${PM.esc(PM.t('cancel'))}</button><button class="button button-primary" type="submit" form="user-form" id="user-save">${PM.esc(PM.t('createUser'))}</button>`
      });
      const username = editor.querySelector('#new-username');
      const display = editor.querySelector('#new-display');
      const save = editor.querySelector('#user-save');
      username.focus();
      editor.querySelector('form').addEventListener('submit', async event => {
        event.preventDefault();
        const name = username.value.trim().toLowerCase();
        const usernameOk = PM.fieldError(username, !/^[a-z0-9._-]{3,32}$/.test(name) ? PM.t('usernameInvalid') : PM.data.users.some(user => user.username === name) ? PM.t('usernameTaken') : '');
        const displayOk = PM.fieldError(display, !display.value.trim() || display.value.trim().length > 100 ? PM.t('displayInvalid') : '');

        if (!usernameOk || !displayOk) {
          (usernameOk ? display : username).focus();
          return;
        }

        save.disabled = true;
        save.textContent = PM.t('saving');

        try {
          await PM.request();
          const user = { id: `user-${Date.now()}`, username: name, displayName: display.value.trim(), role: editor.querySelector('[name="role"]:checked').value, status: 'mustChange', accountIds: [], assignmentsVersion: crypto.randomUUID() };
          PM.data.users.push(user);
          PM.saveData();
          editor.close();
          render();
          showTemporaryPassword(user);
        } catch {
          failure(editor, save, PM.t('createUser'));
        }
      });
    }

    function openEditUser(user) {
      const last = isLastManager(user);
      let active = user.status !== 'disabled';
      const editor = PM.dialog({
        title: PM.t('editNamed', { name: user.displayName }),
        body: `<form class="form" id="user-form" novalidate>
          ${last ? `<div class="message message-info">${PM.icon('info')}<div class="message-body">${PM.esc(PM.t('lastManager', { name: user.displayName }))}</div></div>` : ''}
          <div class="field"><label for="edit-display">${PM.esc(PM.t('displayName'))}</label><input class="input" id="edit-display" maxlength="120" value="${PM.esc(user.displayName)}"><span class="hint">${PM.esc(PM.t('displayHint'))}</span></div>
          ${roleSegments(user.role, last)}
          <div class="switch-row"><span class="field-label" id="active-label">${PM.esc(PM.t('active'))}</span><button class="switch" type="button" role="switch" id="active-switch" aria-labelledby="active-label" aria-checked="${active}" ${last ? 'disabled' : ''}></button></div>
          <div class="message message-warning">${PM.icon('warning')}<div class="message-body">${PM.esc(PM.t('sessionsRevoked'))}</div></div>
        </form>`,
        footer: `<button class="button button-secondary" type="button" data-close>${PM.esc(PM.t('cancel'))}</button><button class="button button-primary" type="submit" form="user-form" id="user-save">${PM.esc(PM.t('save'))}</button>`
      });
      const display = editor.querySelector('#edit-display');
      const toggle = editor.querySelector('#active-switch');
      const save = editor.querySelector('#user-save');
      display.focus();
      toggle.addEventListener('click', () => {
        active = !active;
        toggle.setAttribute('aria-checked', String(active));
      });
      editor.querySelector('form').addEventListener('submit', async event => {
        event.preventDefault();

        if (!PM.fieldError(display, !display.value.trim() || display.value.trim().length > 100 ? PM.t('displayInvalid') : '')) {
          display.focus();
          return;
        }

        save.disabled = true;
        save.textContent = PM.t('saving');

        try {
          await PM.request();
          user.displayName = display.value.trim();
          user.role = editor.querySelector('[name="role"]:checked').value;
          user.status = active ? (user.status === 'disabled' ? 'active' : user.status) : 'disabled';
          PM.saveData();
          editor.close();
          render();
          PM.toast(PM.t('userSaved', { name: user.displayName }));
        } catch {
          failure(editor, save, PM.t('save'));
        }
      });
    }

    function confirmReset(user) {
      const confirm = PM.dialog({
        title: PM.t('resetNamed', { name: user.displayName }),
        body: `<p>${PM.esc(PM.t('resetConfirm', { name: user.displayName }))}</p>`,
        footer: `<button class="button button-secondary" type="button" data-close>${PM.esc(PM.t('cancel'))}</button><button class="button button-primary" type="button" id="reset-confirm">${PM.esc(PM.t('resetPassword'))}</button>`
      });
      const button = confirm.querySelector('#reset-confirm');
      button.focus();
      button.addEventListener('click', async () => {
        button.disabled = true;
        button.textContent = PM.t('saving');

        try {
          await PM.request();

          if (user.status !== 'disabled') {
            user.status = 'mustChange';
          }

          PM.saveData();
          confirm.close();
          render();
          showTemporaryPassword(user);
        } catch {
          failure(confirm, button, PM.t('resetPassword'));
        }
      });
    }

    function showTemporaryPassword(user) {
      const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
      const limit = 2 ** 32 - (2 ** 32 % alphabet.length);
      const values = crypto.getRandomValues(new Uint32Array(12));
      const password = [...values].map(value => {
        while (value >= limit) {
          value = crypto.getRandomValues(new Uint32Array(1))[0];
        }

        return alphabet[value % alphabet.length];
      }).join('').replace(/(.{4})(?=.)/g, '$1-');
      const result = PM.dialog({
        title: PM.t('temporaryPassword'),
        dismissible: false,
        body: `<p>${PM.esc(PM.t('temporaryFor', { name: user.displayName }))}</p>
          <div class="temporary"><code id="temporary-value">${password}</code><button class="button button-secondary" type="button" id="copy">${PM.icon('copy')}${PM.esc(PM.t('copy'))}</button></div>
          <div class="message message-warning">${PM.icon('warning')}<div class="message-body">${PM.esc(PM.t('temporaryOnce', { name: user.displayName }))}</div></div>`,
        footer: `<button class="button button-primary" type="button" data-close>${PM.esc(PM.t('done'))}</button>`
      });
      const copy = result.querySelector('#copy');
      copy.focus();
      copy.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(password);
          PM.toast(PM.t('copied'), 'info');
        } catch {
          getSelection().selectAllChildren(result.querySelector('#temporary-value'));
        }
      });
    }
