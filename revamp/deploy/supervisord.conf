[unix_http_server]
file=/tmp/supervisor.sock
chmod=0600

[supervisord]
nodaemon=true
logfile=/dev/fd/1
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
loglevel=warn

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[eventlistener:fail-fast]
command=/usr/bin/python3 /app/process_events.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
priority=1
startsecs=0
autorestart=unexpected
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:backend]
command=/usr/bin/dotnet /app/backend/PocketMonkey.Host.dll
directory=/app/backend
priority=10
startsecs=1
autorestart=false
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:web]
command=/usr/local/bin/node /app/web/server/server.mjs
directory=/app/web
priority=20
startsecs=1
autorestart=false
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0