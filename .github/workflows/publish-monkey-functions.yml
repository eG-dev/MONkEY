name: Publish Functions App

on:
  push:
    branches:
      - main
    paths-ignore:
      - "WebApp/**"
      - "revamp/**"
      - "THIRD-PARTY-NOTICES.txt"
      - "plans/migration/**"
      - "docs/ADR/**"
      - ".github/instructions/*.instructions.md"
      - ".github/copilot-instructions.md"
      - ".github/workflows/revamp-*.yml"
      - ".github/workflows/revamp-*.yaml"

  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  AZURE_FUNCTIONAPP_NAME: monkey-functions
  WORKING_DIRECTORY: "Functions"
  OUTPUT_DIRECTORY: output

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout GitHub Action"
        uses: actions/checkout@v7

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration Release --output "${{ env.OUTPUT_DIRECTORY }}"

      - name: "Run Azure Functions Action"
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          slot-name: "production"
          publish-profile: ${{ secrets.FUNCTIONS_PUBLISH_PROFILE }}
          package: "${{ env.OUTPUT_DIRECTORY }}"
