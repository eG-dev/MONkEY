name: Wiki Access Check

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  check:
    if: github.ref == 'refs/heads/main' && github.repository == 'eG-dev/MONkEY'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Test Wiki Git write authentication without publishing
        env:
          WIKI_PUBLISH_TOKEN: ${{ secrets.WIKI_PUBLISH_TOKEN }}
          WIKI_URL: https://github.com/${{ github.repository }}.wiki.git
        run: |
          set -euo pipefail
          test -n "$WIKI_PUBLISH_TOKEN"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cat > "$work/askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$WIKI_PUBLISH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$work/askpass"
          export GIT_ASKPASS="$work/askpass" GIT_TERMINAL_PROMPT=0 LC_ALL=C
          git -c credential.helper= clone --quiet -- "$WIKI_URL" "$work/wiki"
          cd "$work/wiki"
          branch=$(git symbolic-ref --short HEAD)
          before=$(git rev-parse HEAD)
          git -c user.name='Wiki access check' -c user.email='wiki-check@users.noreply.github.com' \
            commit --quiet --allow-empty -m 'Wiki authentication candidate; local dry-run only'
          git -c credential.helper= push --dry-run --porcelain origin "HEAD:refs/heads/$branch"
          after=$(git -c credential.helper= ls-remote --exit-code origin "refs/heads/$branch" | cut -f 1)
          test "$before" = "$after"
          printf 'PASS: Wiki Git push dry-run accepted; remote HEAD unchanged. No pages published.\n' >> "$GITHUB_STEP_SUMMARY"