name: Replacement foundation

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "revamp/**"
      - ".github/workflows/revamp-*.yml"
      - ".github/workflows/revamp-*.yaml"
      - ".github/instructions/revamp-*.instructions.md"
      - ".github/copilot-instructions.md"
      - "docs/ADR/**"
      - "plans/migration/**"
      - ".editorconfig"
      - ".github/workflows/publish-monkey-webapp.yml"
      - ".github/workflows/publish-monkey-functions.yml"
  workflow_dispatch:
    inputs:
      export_image:
        description: Export the verified foundation image and Compose example as a non-publishing rehearsal
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: replacement-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: revamp
    env:
      MONKEY_TEST_IMAGE: pocket-monkey:foundation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            revamp/web/package-lock.json
            revamp/tests/e2e/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: revamp/global.json
      - name: Restore locked web dependencies
        run: npm --prefix web ci --ignore-scripts
      - name: Restore locked test tooling
        run: npm --prefix tests/e2e ci --ignore-scripts
      - name: Verify instructions, ADRs, links, and workflow scopes
        run: node ../plans/migration/verify-guardrails.mjs
      - name: Verify translation catalogs
        run: npm --prefix web run check:catalogs
      - name: Audit web dependencies
        run: npm --prefix web audit --audit-level=high
      - name: Audit test tooling
        run: npm --prefix tests/e2e audit --audit-level=high
      - name: Build backend independently
        run: dotnet build PocketMonkey.slnx --configuration Release -p:RestoreLockedMode=true
      - name: Build Angular SSR independently
        run: npm --prefix web run build
      - name: Typecheck E2E fixtures
        run: npm --prefix tests/e2e run check
      - name: Install matching Chromium
        run: npm --prefix tests/e2e exec -- playwright install --with-deps chromium
      - name: Build production image
        run: docker build --file deploy/Dockerfile --tag pocket-monkey:foundation --build-arg BUILD_REVISION="$GITHUB_SHA" .
      - name: Verify the production image
        run: npm --prefix tests/e2e test
      - name: Export verified image without publishing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_image }}
        run: |
          mkdir -p .local/rehearsal
          docker save pocket-monkey:foundation | gzip > .local/rehearsal/foundation-image.tar.gz
          docker image inspect pocket-monkey:foundation > .local/rehearsal/image.json
          cp deploy/compose.yaml .local/rehearsal/compose.yaml
          cd .local/rehearsal
          sha256sum foundation-image.tar.gz image.json compose.yaml > SHA256SUMS
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: foundation-test-results
          path: |
            revamp/tests/e2e/playwright-report
            revamp/tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload non-publishing rehearsal
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_image }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: foundation-rehearsal
          path: revamp/.local/rehearsal
          if-no-files-found: error
          retention-days: 7