name: Publish WebApp

on:
  push:
    branches:
      - main
    paths-ignore:
      - "Functions/**"

  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: monkey-webapp
  AZURE_WEBAPP_PACKAGE_PATH: WebApp/published
  DOTNET_CORE_VERSION: 8.0.x
  WORKING_DIRECTORY: WebApp

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Build
        run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration Release

      - name: Publish
        run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration Release --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
