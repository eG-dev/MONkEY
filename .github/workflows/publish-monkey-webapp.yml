name: Publish WebApp

on:
  push:
    branches:
      - main
    paths-ignore:
      - "Functions/**"
      - "revamp/**"
      - "plans/migration/**"
      - "docs/ADR/**"
      - ".github/instructions/*.instructions.md"
      - ".github/copilot-instructions.md"
      - ".github/workflows/revamp-*.yml"
      - ".github/workflows/revamp-*.yaml"

  workflow_dispatch:

env:
  DOTNET_VERSION: 10.0.x
  AZURE_WEBAPP_NAME: monkey-webapp
  WORKING_DIRECTORY: WebApp
  OUTPUT_DIRECTORY: output

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration Release --output "${{ env.OUTPUT_DIRECTORY }}"

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: "production"
          publish-profile: ${{ secrets.WEBAPP_PUBLISH_PROFILE }}
          package: "${{ env.OUTPUT_DIRECTORY }}"
