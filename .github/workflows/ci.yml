name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ""
      repository_url:
        type: string
        default: ""
      export_image:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      export_image:
        description: Export the verified application image and Compose example as a non-publishing rehearsal
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      MONKEY_TEST_IMAGE: pocket-monkey:local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/e2e/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Restore locked web dependencies
        run: npm --prefix web ci --ignore-scripts
      - name: Restore locked test tooling
        run: npm --prefix tests/e2e ci --ignore-scripts
      - name: Verify About build-input generation and release validation
        run: npm --prefix web run check:about
      - name: Verify instructions, ADRs, links, and workflow scopes
        run: node plans/migration/verify-guardrails.mjs
      - name: Verify translation catalogs
        run: npm --prefix web run check:catalogs
      - name: Audit web dependencies
        run: npm --prefix web audit --audit-level=high
      - name: Audit test tooling
        run: npm --prefix tests/e2e audit --audit-level=high
      - name: Build backend independently
        run: dotnet build PocketMonkey.slnx --configuration Release -p:RestoreLockedMode=true
      - name: Build Angular SSR independently
        run: npm --prefix web run build
      - name: Typecheck E2E fixtures
        run: npm --prefix tests/e2e run check
      # The browser runs in its own network namespace so fixture container veth churn cannot cause ERR_NETWORK_CHANGED.
      - name: Start isolated Playwright browser server
        run: |
          docker run --detach --rm --init --name playwright-browser \
            --publish 127.0.0.1:3000:3000 --workdir /home/pwuser --user pwuser \
            mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 \
            /bin/sh -c "npx -y playwright@1.63.0 run-server --port 3000 --host 0.0.0.0"
      - name: Build production image
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY_URL: ${{ inputs.repository_url }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then
            test "$GITHUB_REF_TYPE" = tag
            test "$RELEASE_TAG" = "$GITHUB_REF_NAME"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            args+=(--release-tag "$RELEASE_TAG" --repository-url "$REPOSITORY_URL")
          fi
          npm --prefix web run build:image -- "${args[@]}"
      - name: Wait for Playwright browser server
        run: timeout 120 sh -c 'until docker logs playwright-browser 2>&1 | grep -q "Listening on"; do sleep 1; done' || { docker logs playwright-browser; exit 1; }
      - name: Verify the production image
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:3000/
          PW_TEST_CONNECT_EXPOSE_NETWORK: "<loopback>"
        run: npm --prefix tests/e2e test
      - name: Export verified image without publishing
        if: ${{ inputs.export_image }}
        run: |
          mkdir -p .local/rehearsal
          docker save pocket-monkey:local | gzip > .local/rehearsal/verified-image.tar.gz
          docker image inspect pocket-monkey:local > .local/rehearsal/image.json
          cp deploy/compose.yaml .local/rehearsal/compose.yaml
          cp deploy/compose.exports.yaml deploy/compose.env.example .local/rehearsal/
          cp .build/about/build-info.json .local/rehearsal/
          node <<'NODE'
          const fs = require('node:fs');
          const YAML = require('./tests/e2e/node_modules/yaml');
          const compose = YAML.parse(fs.readFileSync('deploy/compose.yaml', 'utf8'));
          delete compose.services.app.build;
          fs.writeFileSync('.local/rehearsal/deployment.json', JSON.stringify(compose, null, 2) + '\n');
          NODE
          cd .local/rehearsal
          sha256sum verified-image.tar.gz image.json compose.yaml compose.exports.yaml compose.env.example build-info.json deployment.json > SHA256SUMS
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: test-results
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload non-publishing rehearsal
        if: ${{ success() && inputs.export_image }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verified-image
          path: .local/rehearsal
          if-no-files-found: error
          retention-days: 7