services:
  app:
    image: pocket-monkey:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TZ: Europe/Berlin
      MONKEY_PUBLIC_URL: https://monkey.home.example
      MONKEY_DEFAULT_LOCALE: de-DE
      MONKEY_CURRENCY: EUR
      MONKEY_TRANSACTION_RETENTION_MONTHS: "24"
      MONKEY_TRUSTED_PROXIES: ""
    volumes:
      - monkey-data:/data
    restart: on-failure
    stop_grace_period: 25s
volumes:
  monkey-data: